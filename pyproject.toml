[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefx"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "streamlit>=1.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
